name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Attach the package to the release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.tgz"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Attach the package to the release
        if: github.event_name == 'release'
        run: gh release upload "$TAG" *.tgz
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish *.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
